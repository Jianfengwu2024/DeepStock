services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:15.17-alpine
    container_name: bnhmm-postgres
    restart: unless-stopped
    env_file:
      - ../../bnhmm-storage/postgres.env
    ports:
      - "127.0.0.1:15454:5432"
    volumes:
      - /mnt/data/wujianfeng/private/bnhmm-storage/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

