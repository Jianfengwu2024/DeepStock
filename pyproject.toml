[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bnhmm-engine"
version = "0.18.0"
description = "Offline Bayesian neural hidden-state market model engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
data = ["duckdb>=1.4"]
storage = ["psycopg[binary]>=3.2"]
model = ["torch>=2.5"]
training = ["duckdb>=1.4", "torch>=2.5"]
evaluation = ["matplotlib>=3.8"]
visualization = ["duckdb>=1.4", "pillow>=10.0"]
web = ["fastapi>=0.109", "uvicorn>=0.27"]
dev = ["pytest>=8.0"]

[project.scripts]
bnhmm = "bnhmm.cli:main"
bnhmm-web = "bnhmm.web.app:run"
bnhmm-visual-dataset = "bnhmm.visual_dataset:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bnhmm"]

[tool.hatch.build.targets.wheel.force-include]
"src/bnhmm/storage/migrations" = "bnhmm/storage/migrations"
"src/bnhmm/web/static" = "bnhmm/web/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
