<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepStock Lab</title>
  <link rel="stylesheet" href="/static/styles.css?v=0.29.0">
</head>
<body>
  <div class="app-shell">
    <aside class="config-panel" id="config-panel">
      <header class="brand-row"><div><div class="brand">DeepStock Lab</div><div class="brand-sub">严格样本外模型实验</div></div></header>
      <form id="experiment-form">
        <section class="form-section">
          <h2>实验</h2>
          <div class="strategy-switch">
            <label><input type="radio" name="strategy" value="bnhmm" checked><span>BNHMM</span></label>
            <label><input type="radio" name="strategy" value="boundary-flow-fk"><span>FK-贝叶斯</span></label>
          </div>
          <label>测试名称<input name="name" required maxlength="64"></label>
          <label id="dataset-field">板块数据集<select name="dataset_id" id="dataset-select"></select></label>
          <div class="dataset-summary" id="dataset-summary"></div>
          <label>数据文件<input name="database_path" required></label>
          <label>股票代码<textarea name="symbols" rows="3" required spellcheck="false"></textarea></label>
          <div class="two-columns">
            <label>开始日期<input name="start" type="date" required></label>
            <label>结束日期<input name="end" type="date" required></label>
          </div>
          <label>最大折数<input name="max_folds" type="number" min="1" placeholder="不限"></label>
        </section>
        <section class="form-section" id="bnhmm-fields">
          <h2>BNHMM 配置</h2>
          <div class="two-columns">
            <label>计算设备<select name="device" id="device-select"></select></label>
            <label>训练轮数<input name="epochs" type="number" min="1"></label>
            <label>批量<input name="batch_size" type="number" min="1"></label>
            <label>学习率<input name="learning_rate" type="number" min="0" step="0.00001"></label>
            <label>最少训练日<input name="minimum_train_sessions" type="number" min="10"></label>
            <label>调参日<input name="tuning_sessions" type="number" min="2"></label>
            <label>测试日<input name="test_sessions" type="number" min="1"></label>
            <label>步长<input name="step_sessions" type="number" min="1"></label>
            <label>多日记忆<input name="sequence_length" type="number" min="2" max="20"></label>
            <label>隐藏态<input name="latent_states" type="number" min="13"></label>
            <label>状态宽度<input name="d_model" type="number" min="8"></label>
            <label>注意力头<input name="heads" type="number" min="1"></label>
            <label>层数<input name="layers" type="number" min="1"></label>
            <label>交易成本 BP<input name="transaction_cost_bps" type="number" min="0" step="0.1"></label>
          </div>
          <label class="toggle-row"><span>确定性训练</span><input name="deterministic_training" type="checkbox"></label>
        </section>
        <section class="form-section hidden" id="boundary-fields">
          <h2>FK-贝叶斯配置</h2>
          <div class="data-status">
            <div><strong>60日连续扩散数据</strong><span id="boundary-data-status">尚未检查</span></div>
            <button class="secondary-button" type="button" id="boundary-data-build">重建数据</button>
          </div>
          <div class="fixed-spec"><span>价格锚点</span><strong>窗口前一交易日收盘，60日内不重置</strong></div>
          <div class="fixed-spec"><span>交易规则</span><strong>看多：全仓买入最强前 1/2；看平：每次减总资产的 1/4；看空：立即全部清仓</strong></div>
          <div class="two-columns">
            <label>最少训练日<input name="minimum_train_sessions" type="number" min="30"></label>
            <label>平区间（波动率倍数）<input name="regime_neutral_sigma" type="number" min="0.01" step="0.01"></label>
            <label>漂移半衰期（日）<input name="boundary_drift_half_life_sessions" type="number" min="5"></label>
            <label>FK 路径数<input name="boundary_fk_paths" type="number" min="1000" step="1000"></label>
            <label>方向最低概率<input name="boundary_minimum_direction_probability" type="number" min="0.5" max="1" step="0.01"></label>
            <label>最低信噪比<input name="boundary_minimum_signal_to_noise" type="number" min="0" step="0.01"></label>
            <label>外势最低可信度<input name="boundary_minimum_survival_probability" type="number" min="0" max="1" step="0.01"></label>
            <label>强股回看（日）<input name="boundary_relative_strength_lookback_sessions" type="number" min="2"></label>
            <label>峰值回撤止损<input name="boundary_maximum_drawdown" type="number" min="0.01" max="0.5" step="0.01"></label>
            <label>交易成本 BP<input name="transaction_cost_bps" type="number" min="0" step="0.1"></label>
            <label>随机种子<input name="seed" type="number" min="0"></label>
          </div>
        </section>
        <div class="form-actions"><button class="primary-button" type="submit" id="run-button">开始测试</button><div id="form-error" class="form-error" role="alert"></div></div>
      </form>
    </aside>
    <main class="workspace">
      <header class="workspace-header">
        <div><h1>样本外测试</h1><p id="job-subtitle">选择历史任务或开始新实验</p></div>
        <div class="header-actions"><span class="gpu-monitor" id="gpu-monitor"></span><span class="status-badge" id="global-status">空闲</span><button class="icon-button" type="button" id="refresh-button" title="刷新">↻</button></div>
      </header>
      <div class="work-grid">
        <section class="run-history">
          <div class="section-head"><div><h2>历史测试</h2><span id="run-count">0</span></div><div><button class="icon-button" type="button" id="edit-history-button">编辑</button><button class="danger-button hidden" type="button" id="batch-delete-button">删除</button></div></div>
          <div class="history-batch-actions hidden" id="history-batch-actions"><label><input type="checkbox" id="history-select-all">全选</label><span id="history-selected-count">已选 0</span></div>
          <div id="job-list" class="job-list"></div>
        </section>
        <section class="result-area">
          <div class="empty-state" id="empty-state">选择一个历史测试查看结果</div>
          <div id="job-view" class="job-view hidden">
            <header class="run-header"><div><h2 id="run-title"></h2><div id="run-meta" class="run-meta"></div></div><button class="danger-button hidden" id="cancel-button" type="button">终止</button></header>
            <div class="progress-band hidden" id="progress-band"><div><strong id="progress-label">任务运行中</strong><span id="elapsed-time"></span></div><progress id="progress-value" max="100" value="0"></progress></div>
            <nav class="result-tabs" id="result-tabs">
              <button data-tab="evaluation" class="active">策略评估</button><button data-tab="predictions">样本外预测</button><button data-tab="posterior">模型后验</button><button data-tab="returns">收益分析</button><button data-tab="residuals">残差分析</button><button data-tab="summary">运行摘要</button><button data-tab="logs">日志</button>
            </nav>
            <section class="result-panel" data-panel="evaluation"><div id="evaluation-content"></div></section>
            <section class="result-panel hidden" data-panel="predictions"><div id="predictions-content"></div></section>
            <section class="result-panel hidden" data-panel="posterior"><div id="posterior-content"></div></section>
            <section class="result-panel hidden" data-panel="returns"><div id="returns-content"></div></section>
            <section class="result-panel hidden" data-panel="residuals"><div id="residuals-content"></div></section>
            <section class="result-panel hidden" data-panel="summary"><div id="summary-content"></div></section>
            <section class="result-panel hidden" data-panel="logs"><pre id="job-log"></pre></section>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="/static/app.js?v=0.29.0"></script>
</body>
</html>
