<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>板块河道 · DeepStock Lab</title>
  <link rel="stylesheet" href="/static/river.css?v=0.28.0">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <script src="/static/river.js?v=0.20.0" defer></script>
</head>
<body>
  <div class="river-shell">
    <header class="river-header">
      <div class="river-brand">
        <a class="icon-button" href="/" title="返回测试列表"><i data-lucide="arrow-left"></i></a>
        <div><strong>板块河道</strong><span>SectorFlowBayes v2</span></div>
      </div>
      <div class="river-filters">
        <label>月份<select id="month-select"></select></label>
        <label>交易日<select id="session-select"></select></label>
      </div>
      <div class="topology-status">
        <span id="river-status" role="status" aria-live="polite">正在读取制品</span>
        <strong id="topology-cutoff">拓扑截止 --</strong>
      </div>
    </header>

    <nav class="river-tabs" aria-label="河道视图">
      <button class="river-tab active" data-view="heatmap-panel" type="button" title="每日河道">
        <i data-lucide="waves"></i><span>每日河道</span>
      </button>
      <button class="river-tab" data-view="topology-panel" type="button" title="同步拓扑">
        <i data-lucide="share-2"></i><span>同步拓扑</span>
      </button>
      <button class="river-tab" data-view="migration-panel" type="button" title="月度迁移">
        <i data-lucide="git-compare-arrows"></i><span>月度迁移</span>
      </button>
      <button class="river-tab" data-view="structure-panel" type="button" title="结构诊断">
        <i data-lucide="scan-search"></i><span>结构诊断</span>
      </button>
      <button class="river-tab" data-view="forecast-view" type="button" title="次日预测">
        <i data-lucide="scan-eye"></i><span>次日预测</span>
      </button>
    </nav>

    <main class="river-workspace">
      <section class="river-panel" id="heatmap-panel">
        <div class="view-toolbar">
          <div class="segmented" role="radiogroup" aria-label="热图通道">
            <label><input type="radio" name="channel" value="velocity" checked><span>价格速度</span></label>
            <label><input type="radio" name="channel" value="residual_velocity"><span>残差速度</span></label>
            <label><input type="radio" name="channel" value="activity"><span>成交密度</span></label>
          </div>
          <label class="density-toggle"><input id="density-opacity" type="checkbox" checked><span>密度置信</span></label>
          <div class="legend"><span class="legend-negative"></span>下行 <span class="legend-neutral"></span>平衡 <span class="legend-positive"></span>上行</div>
        </div>
        <div class="heatmap-layout">
          <div class="heatmap-stage">
            <div class="heatmap-axis"><span>09:31</span><span>10:30</span><span>11:30</span><span>14:00</span><span>15:00</span></div>
            <div class="heatmap-scroll" id="heatmap-scroll">
              <canvas id="river-heatmap" aria-label="股票与分钟同步河道热图"></canvas>
              <div class="heatmap-tooltip hidden" id="heatmap-tooltip"></div>
            </div>
            <div class="inline-error hidden" id="river-error" role="alert"></div>
          </div>
          <aside id="stock-inspector" class="stock-inspector">
            <div class="inspector-empty"><i data-lucide="mouse-pointer-2"></i><strong>选择一只股票</strong><span>点击热图行或拓扑节点</span></div>
          </aside>
        </div>
      </section>

      <section class="river-panel hidden" id="topology-panel">
        <div class="view-heading"><div><h1>同步拓扑</h1><p>完整图参与推断，纵轴排序只是拓扑在屏幕上的投影。</p></div><span id="topology-summary"></span></div>
        <div class="svg-stage"><svg id="topology-view" role="img" aria-label="板块同步拓扑图"></svg></div>
      </section>

      <section class="river-panel hidden" id="migration-panel">
        <div class="view-heading"><div><h1>月度迁移</h1><p>每月仅重排一次；同一月份内行位置完全冻结。</p></div><span id="migration-summary"></span></div>
        <div class="svg-stage"><svg id="migration-view" role="img" aria-label="股票月度流带迁移图"></svg></div>
      </section>

      <section class="river-panel hidden" id="structure-panel">
        <div class="view-heading"><div><h1>结构诊断</h1><p>先确认同步结构稳定，再解释预测表现。</p></div></div>
        <div id="structure-view" class="structure-view">
          <div class="structure-metrics" id="structure-metrics"></div>
          <div class="structure-table-wrap">
            <table><thead><tr><th>股票</th><th>流带</th><th>凝聚度</th><th>中心性</th><th>已分配</th></tr></thead><tbody id="structure-table"></tbody></table>
          </div>
        </div>
      </section>

      <section class="river-panel hidden" id="forecast-view">
        <div class="view-heading">
          <div><h1>次日状态图</h1><p>模型在当日收盘后给出的下一交易日板块状态预测。</p></div>
          <label>信号日<select id="forecast-select"></select></label>
        </div>
        <div class="forecast-summary" id="forecast-summary"></div>
        <div class="forecast-stage"><canvas id="forecast-canvas" aria-label="下一交易日板块状态预测图"></canvas></div>
      </section>
    </main>
  </div>
</body>
</html>
